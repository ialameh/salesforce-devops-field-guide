name: Deploy to integration

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to integration
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_INTEGRATION }}
        run: |
          echo "$SFDX_AUTH_URL" > /tmp/auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/auth.txt --alias integration

      - name: Deploy
        run: sf project deploy start --target-org integration --test-level RunLocalTests

      - name: Notify
        if: always()
        run: echo "Deploy status: ${{ job.status }}"
