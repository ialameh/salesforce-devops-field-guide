<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="ds-pt" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>

  <text x="550" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Package Types: Pick One</text>
  <text x="550" y="56" font-size="13" text-anchor="middle" fill="#64748b">Five ways to ship Salesforce metadata. Most teams need one or two. Mixing creates pain.</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40" y="90" width="160" height="40" rx="6" fill="#0f172a"/>
    <text x="120" y="115" fill="#ffffff">Criterion</text>
    <rect x="205" y="90" width="170" height="40" rx="6" fill="#15803d"/>
    <text x="290" y="115" fill="#ffffff">Org-based deploy</text>
    <rect x="380" y="90" width="170" height="40" rx="6" fill="#1d4ed8"/>
    <text x="465" y="115" fill="#ffffff">2GP Unlocked</text>
    <rect x="555" y="90" width="170" height="40" rx="6" fill="#6d28d9"/>
    <text x="640" y="115" fill="#ffffff">2GP Unlocked (Org-Dep.)</text>
    <rect x="730" y="90" width="170" height="40" rx="6" fill="#be185d"/>
    <text x="815" y="115" fill="#ffffff">2GP Managed</text>
    <rect x="905" y="90" width="155" height="40" rx="6" fill="#92400e"/>
    <text x="982" y="115" fill="#ffffff">1GP Managed</text>
  </g>

  <g font-size="11">
    <!-- Versioning -->
    <rect x="40" y="135" width="160" height="36" fill="#f1f5f9"/>
    <text x="55" y="158" font-weight="600" fill="#0f172a">Versioning</text>
    <text x="290" y="158" text-anchor="middle" fill="#166534">None (just commits)</text>
    <text x="465" y="158" text-anchor="middle" fill="#1e40af">Yes, atomic versions</text>
    <text x="640" y="158" text-anchor="middle" fill="#5b21b6">Yes</text>
    <text x="815" y="158" text-anchor="middle" fill="#9d174d">Yes, ancestry-locked</text>
    <text x="982" y="158" text-anchor="middle" fill="#9a3412">Yes, ancestry-locked</text>

    <!-- Code visibility -->
    <rect x="40" y="173" width="160" height="36" fill="#ffffff"/>
    <text x="55" y="196" font-weight="600" fill="#0f172a">Code visibility</text>
    <text x="290" y="196" text-anchor="middle" fill="#166534">Open in target</text>
    <text x="465" y="196" text-anchor="middle" fill="#1e40af">Open in target</text>
    <text x="640" y="196" text-anchor="middle" fill="#5b21b6">Open in target</text>
    <text x="815" y="196" text-anchor="middle" fill="#9d174d">Hidden (IP protection)</text>
    <text x="982" y="196" text-anchor="middle" fill="#9a3412">Hidden</text>

    <!-- Edit in target -->
    <rect x="40" y="211" width="160" height="36" fill="#f1f5f9"/>
    <text x="55" y="234" font-weight="600" fill="#0f172a">Edit in target org</text>
    <text x="290" y="234" text-anchor="middle" fill="#166534">Yes</text>
    <text x="465" y="234" text-anchor="middle" fill="#1e40af">Yes (overrides)</text>
    <text x="640" y="234" text-anchor="middle" fill="#5b21b6">Yes</text>
    <text x="815" y="234" text-anchor="middle" fill="#9d174d">No</text>
    <text x="982" y="234" text-anchor="middle" fill="#9a3412">No</text>

    <!-- Namespace -->
    <rect x="40" y="249" width="160" height="36" fill="#ffffff"/>
    <text x="55" y="272" font-weight="600" fill="#0f172a">Namespace required</text>
    <text x="290" y="272" text-anchor="middle" fill="#166534">No</text>
    <text x="465" y="272" text-anchor="middle" fill="#1e40af">Optional</text>
    <text x="640" y="272" text-anchor="middle" fill="#5b21b6">No</text>
    <text x="815" y="272" text-anchor="middle" fill="#9d174d">Yes</text>
    <text x="982" y="272" text-anchor="middle" fill="#9a3412">Yes</text>

    <!-- Multi-org install -->
    <rect x="40" y="287" width="160" height="36" fill="#f1f5f9"/>
    <text x="55" y="310" font-weight="600" fill="#0f172a">Install in many orgs</text>
    <text x="290" y="310" text-anchor="middle" fill="#166534">Each gets own deploy</text>
    <text x="465" y="310" text-anchor="middle" fill="#1e40af">Single version, many orgs</text>
    <text x="640" y="310" text-anchor="middle" fill="#5b21b6">No, single org</text>
    <text x="815" y="310" text-anchor="middle" fill="#9d174d">Yes, AppExchange</text>
    <text x="982" y="310" text-anchor="middle" fill="#9a3412">Yes, legacy</text>

    <!-- Dependencies -->
    <rect x="40" y="325" width="160" height="36" fill="#ffffff"/>
    <text x="55" y="348" font-weight="600" fill="#0f172a">Dependencies</text>
    <text x="290" y="348" text-anchor="middle" fill="#166534">Implicit</text>
    <text x="465" y="348" text-anchor="middle" fill="#1e40af">Explicit, locked</text>
    <text x="640" y="348" text-anchor="middle" fill="#5b21b6">Explicit, looser</text>
    <text x="815" y="348" text-anchor="middle" fill="#9d174d">Explicit, ancestry</text>
    <text x="982" y="348" text-anchor="middle" fill="#9a3412">Explicit, ancestry</text>

    <!-- Recommended for -->
    <rect x="40" y="363" width="160" height="36" fill="#f1f5f9"/>
    <text x="55" y="386" font-weight="600" fill="#0f172a">Recommended for</text>
    <text x="290" y="386" text-anchor="middle" fill="#166534">Small projects, single org</text>
    <text x="465" y="386" text-anchor="middle" fill="#1e40af">Internal team apps</text>
    <text x="640" y="386" text-anchor="middle" fill="#5b21b6">Customer-specific</text>
    <text x="815" y="386" text-anchor="middle" fill="#9d174d">AppExchange / ISV</text>
    <text x="982" y="386" text-anchor="middle" fill="#9a3412">(legacy, do not start here)</text>

    <!-- Promote to released -->
    <rect x="40" y="401" width="160" height="36" fill="#ffffff"/>
    <text x="55" y="424" font-weight="600" fill="#0f172a">Promote to released</text>
    <text x="290" y="424" text-anchor="middle" fill="#166534">N/A</text>
    <text x="465" y="424" text-anchor="middle" fill="#1e40af">From DevHub</text>
    <text x="640" y="424" text-anchor="middle" fill="#5b21b6">Same as Unlocked</text>
    <text x="815" y="424" text-anchor="middle" fill="#9d174d">From DevHub + LMA</text>
    <text x="982" y="424" text-anchor="middle" fill="#9a3412">From packaging org</text>
  </g>

  <g filter="url(#ds-pt)">
    <rect x="40" y="455" width="1020" height="155" rx="10" fill="#0f172a" stroke="#0f172a"/>
  </g>
  <text x="60" y="480" font-size="13" font-weight="700" fill="#fff">Picker</text>
  <text x="60" y="503" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#86efac">Org-based deploy:</tspan> default for small to medium internal projects. Move on when you outgrow it.</text>
  <text x="60" y="523" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#93c5fd">2GP Unlocked:</tspan> if multiple orgs need the same code. Versioned, atomic, multi-target. Go-to for internal IT.</text>
  <text x="60" y="543" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#c4b5fd">2GP Unlocked (Org-Dependent):</tspan> when the package depends on org-specific metadata you cannot package.</text>
  <text x="60" y="563" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#fbcfe8">2GP Managed:</tspan> AppExchange listings, IP-protected ISV apps. Locks code, supports upgrades cleanly.</text>
  <text x="60" y="583" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#fdba74">1GP Managed:</tspan> only if you already have one. Don't start a new 1GP today.</text>
</svg>
