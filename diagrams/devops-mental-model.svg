<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="ds-mm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>

  <text x="550" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Salesforce DevOps: Four Stores of Truth</text>
  <text x="550" y="56" font-size="13" text-anchor="middle" fill="#64748b">Every Salesforce DevOps decision is about which of these the answer lives in.</text>

  <!-- Source -->
  <g filter="url(#ds-mm)">
    <rect x="40" y="100" width="240" height="200" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  </g>
  <text x="160" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#14532d">1. Source repository</text>
  <text x="160" y="158" font-size="11" font-style="italic" text-anchor="middle" fill="#166534">Where developers commit</text>
  <text x="60" y="190" font-size="11" fill="#15803d">Apex, LWC, flows, metadata XML</text>
  <text x="60" y="208" font-size="11" fill="#15803d">in source format</text>
  <text x="60" y="234" font-size="11" fill="#15803d">sfdx-project.json</text>
  <text x="60" y="252" font-size="11" fill="#15803d">.forceignore</text>
  <text x="60" y="270" font-size="11" fill="#15803d">manifest/package.xml</text>
  <text x="60" y="288" font-size="11" fill="#15803d">scratch org definitions</text>

  <!-- Scratch / Dev -->
  <g filter="url(#ds-mm)">
    <rect x="320" y="100" width="240" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="440" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#78350f">2. Scratch / dev orgs</text>
  <text x="440" y="158" font-size="11" font-style="italic" text-anchor="middle" fill="#92400e">Where iteration happens</text>
  <text x="340" y="190" font-size="11" fill="#b45309">Disposable orgs</text>
  <text x="340" y="208" font-size="11" fill="#b45309">Source tracking enabled</text>
  <text x="340" y="226" font-size="11" fill="#b45309">push/pull (not deploy)</text>
  <text x="340" y="252" font-size="11" fill="#b45309">Created from definition</text>
  <text x="340" y="270" font-size="11" fill="#b45309">Lifetime in days</text>
  <text x="340" y="288" font-size="11" fill="#b45309">Snowflakes are forbidden</text>

  <!-- Package Registry -->
  <g filter="url(#ds-mm)">
    <rect x="600" y="100" width="240" height="200" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="720" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#172554">3. Package registry</text>
  <text x="720" y="158" font-size="11" font-style="italic" text-anchor="middle" fill="#1e40af">DevHub holds the truth</text>
  <text x="620" y="190" font-size="11" fill="#1d4ed8">2GP unlocked packages</text>
  <text x="620" y="208" font-size="11" fill="#1d4ed8">2GP managed packages</text>
  <text x="620" y="226" font-size="11" fill="#1d4ed8">Versions, ancestry</text>
  <text x="620" y="252" font-size="11" fill="#1d4ed8">Dependency graph</text>
  <text x="620" y="270" font-size="11" fill="#1d4ed8">Released vs Beta</text>
  <text x="620" y="288" font-size="11" fill="#1d4ed8">Branch-based packaging</text>

  <!-- Target orgs -->
  <g filter="url(#ds-mm)">
    <rect x="880" y="100" width="180" height="200" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  </g>
  <text x="970" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#831843">4. Target orgs</text>
  <text x="970" y="158" font-size="11" font-style="italic" text-anchor="middle" fill="#9d174d">Where users live</text>
  <text x="900" y="190" font-size="11" fill="#be185d">Sandboxes</text>
  <text x="900" y="208" font-size="11" fill="#be185d">UAT, staging</text>
  <text x="900" y="226" font-size="11" fill="#be185d">Production</text>
  <text x="900" y="252" font-size="11" fill="#be185d">Source tracking off</text>
  <text x="900" y="270" font-size="11" fill="#be185d">deploy (not push)</text>
  <text x="900" y="288" font-size="11" fill="#be185d">Years of org state</text>

  <!-- Arrows top row -->
  <line x1="280" y1="200" x2="320" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr-mm)"/>
  <text x="300" y="190" font-size="9" text-anchor="middle" fill="#475569">push</text>
  <line x1="320" y1="220" x2="280" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arr-mm)"/>
  <text x="300" y="234" font-size="9" text-anchor="middle" fill="#475569">pull</text>

  <line x1="560" y1="200" x2="600" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr-mm)"/>
  <text x="580" y="190" font-size="9" text-anchor="middle" fill="#475569">create version</text>

  <line x1="840" y1="200" x2="880" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr-mm)"/>
  <text x="860" y="190" font-size="9" text-anchor="middle" fill="#475569">install</text>

  <!-- Source to deploy direct path (org-based deploys) -->
  <path d="M 160 300 Q 160 380 970 380 L 970 300" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-mm)"/>
  <text x="565" y="375" font-size="11" font-weight="700" text-anchor="middle" fill="#475569">deploy (org-based, no package)</text>

  <!-- Bottom: workflow rows -->
  <text x="40" y="430" font-size="14" font-weight="700" fill="#0f172a">Two valid workflows</text>

  <!-- Workflow A: Org-based -->
  <g filter="url(#ds-mm)">
    <rect x="40" y="445" width="500" height="115" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="60" y="470" font-size="13" font-weight="700" fill="#0f172a">A. Org-based deploys</text>
  <text x="60" y="490" font-size="11" fill="#334155">Source -> sandbox -> sandbox -> production via metadata API.</text>
  <text x="60" y="508" font-size="11" fill="#334155">Simple. Fits incremental change. No package management.</text>
  <text x="60" y="528" font-size="11" font-weight="600" fill="#15803d">Pick when: small team, no managed package, single org chain.</text>
  <text x="60" y="546" font-size="11" font-weight="600" fill="#dc2626">Risk: source drift, deploy size grows, no versioning.</text>

  <!-- Workflow B: Package-based -->
  <g filter="url(#ds-mm)">
    <rect x="560" y="445" width="500" height="115" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>
  <text x="580" y="470" font-size="13" font-weight="700" fill="#172554">B. Package-based</text>
  <text x="580" y="490" font-size="11" fill="#334155">Source -> 2GP version -> install in sandboxes -> install in prod.</text>
  <text x="580" y="508" font-size="11" fill="#334155">Versioned. Atomic install/uninstall. Multi-tenant friendly.</text>
  <text x="580" y="528" font-size="11" font-weight="600" fill="#15803d">Pick when: shared codebase, multiple targets, AppExchange.</text>
  <text x="580" y="546" font-size="11" font-weight="600" fill="#dc2626">Risk: dependency hell, ancestry traps, learning curve.</text>

  <!-- Bottom rule -->
  <g filter="url(#ds-mm)">
    <rect x="40" y="585" width="1020" height="115" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="60" y="610" font-size="13" font-weight="700" fill="#fff">First decision in any Salesforce DevOps engagement</text>
  <text x="60" y="635" font-size="12" fill="#cbd5e1">Which workflow are we using? A and B require different repo layouts, different CI configs, different release runbooks.</text>
  <text x="60" y="655" font-size="12" fill="#cbd5e1">A is fine until it isn't. The transition from A to B is painful and slow. Make the call deliberately.</text>
  <text x="60" y="680" font-size="12" font-style="italic" fill="#94a3b8">If you're unsure, default to A and revisit when the codebase is big enough that single-deploy operations take more than 30 minutes.</text>
</svg>
