<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-br" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="ds-br" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1100" height="580" fill="#ffffff"/>

  <text x="550" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Branching: Pick the Smallest That Works</text>
  <text x="550" y="56" font-size="13" text-anchor="middle" fill="#64748b">Most teams overcomplicate. Trunk-based works for most. Reach for GitFlow only when you have multiple long-lived release versions in production.</text>

  <!-- Trunk-based -->
  <g filter="url(#ds-br)">
    <rect x="40" y="100" width="510" height="200" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  </g>
  <text x="295" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#14532d">Trunk-based</text>
  <text x="295" y="155" font-size="11" font-style="italic" text-anchor="middle" fill="#166534">Default. Works for 80% of Salesforce teams.</text>

  <line x1="80" y1="220" x2="510" y2="220" stroke="#15803d" stroke-width="3"/>
  <circle cx="120" cy="220" r="8" fill="#15803d"/>
  <circle cx="200" cy="220" r="8" fill="#15803d"/>
  <circle cx="280" cy="220" r="8" fill="#15803d"/>
  <circle cx="360" cy="220" r="8" fill="#15803d"/>
  <circle cx="440" cy="220" r="8" fill="#15803d"/>
  <text x="80" y="245" font-size="10" fill="#14532d">main</text>

  <line x1="160" y1="220" x2="160" y2="195" stroke="#15803d" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="160" cy="190" r="6" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <text x="160" y="180" font-size="9" text-anchor="middle" fill="#15803d">feat/x</text>

  <line x1="320" y1="220" x2="320" y2="260" stroke="#15803d" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="320" cy="265" r="6" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <text x="320" y="282" font-size="9" text-anchor="middle" fill="#15803d">feat/y</text>

  <text x="60" y="290" font-size="11" fill="#15803d">Short-lived feature branches. Merge to main daily.</text>

  <!-- GitFlow -->
  <g filter="url(#ds-br)">
    <rect x="570" y="100" width="490" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="815" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#78350f">GitFlow</text>
  <text x="815" y="155" font-size="11" font-style="italic" text-anchor="middle" fill="#92400e">Heavyweight. Use only with parallel release versions.</text>

  <line x1="600" y1="180" x2="1040" y2="180" stroke="#d97706" stroke-width="3"/>
  <text x="590" y="184" font-size="9" text-anchor="end" fill="#78350f">main</text>
  <line x1="600" y1="220" x2="1040" y2="220" stroke="#92400e" stroke-width="2"/>
  <text x="590" y="224" font-size="9" text-anchor="end" fill="#92400e">develop</text>
  <line x1="700" y1="260" x2="900" y2="260" stroke="#fbbf24" stroke-width="2"/>
  <text x="690" y="264" font-size="9" text-anchor="end" fill="#a16207">release/1.x</text>

  <circle cx="650" cy="220" r="5" fill="#92400e"/>
  <circle cx="730" cy="220" r="5" fill="#92400e"/>
  <circle cx="800" cy="220" r="5" fill="#92400e"/>

  <line x1="730" y1="220" x2="730" y2="260" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="850" y1="260" x2="850" y2="180" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="850" cy="180" r="5" fill="#d97706"/>
  <text x="855" y="170" font-size="9" fill="#78350f">v1.0</text>

  <text x="590" y="290" font-size="11" fill="#92400e">Adds release branches. Adds hotfix branches. Adds complexity.</text>

  <!-- Bottom: Org-mapped branching -->
  <g filter="url(#ds-br)">
    <rect x="40" y="320" width="1020" height="240" rx="10" fill="#0f172a" stroke="#0f172a"/>
  </g>
  <text x="60" y="345" font-size="14" font-weight="700" fill="#fff">Org-mapped branching (Salesforce-specific)</text>

  <text x="60" y="370" font-size="11" fill="#cbd5e1">Salesforce DevOps adds a wrinkle. You typically have several long-lived environments (dev sandbox, integration, QA, UAT, production)</text>
  <text x="60" y="385" font-size="11" fill="#cbd5e1">and you need to know which branch each one is on. Two patterns:</text>

  <text x="60" y="415" font-size="12" font-weight="700" fill="#86efac">Pattern 1. main maps to production</text>
  <text x="60" y="433" font-size="11" fill="#cbd5e1">main = production. Develop on feature branches, merge to main on release. Tag releases. Hotfixes branch off main.</text>
  <text x="60" y="448" font-size="11" fill="#cbd5e1">Lower environments (integration, QA, UAT) deploy from tags or specific commits. Best for trunk-based teams.</text>

  <text x="60" y="478" font-size="12" font-weight="700" fill="#fbbf24">Pattern 2. environment branches</text>
  <text x="60" y="496" font-size="11" fill="#cbd5e1">main = production, qa = qa sandbox, integration = integration sandbox. Push from one to the next as work promotes.</text>
  <text x="60" y="511" font-size="11" fill="#cbd5e1">More complex. Risk of branch divergence. Useful when each environment serves different teams reviewing different work.</text>

  <text x="60" y="540" font-size="11" font-style="italic" fill="#94a3b8">Pick Pattern 1 unless you have a specific reason for Pattern 2. Most teams that picked Pattern 2 wish they had picked Pattern 1.</text>
</svg>
