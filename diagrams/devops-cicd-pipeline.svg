<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="ds-cd" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>

  <text x="600" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">A Reference Salesforce CI/CD Pipeline</text>
  <text x="600" y="56" font-size="13" text-anchor="middle" fill="#64748b">Three rows: pull request, merge to main, release tag. Each row terminates in a gate, not a deploy-by-default.</text>

  <!-- Row labels -->
  <text x="40" y="120" font-size="13" font-weight="700" fill="#475569">Pull request</text>
  <text x="40" y="240" font-size="13" font-weight="700" fill="#475569">Merge to main</text>
  <text x="40" y="380" font-size="13" font-weight="700" fill="#475569">Release tag</text>

  <!-- PR row -->
  <g filter="url(#ds-cd)">
    <rect x="160" y="95" width="120" height="55" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="220" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#172554">Lint + compile</text>
  <text x="220" y="138" font-size="9" text-anchor="middle" fill="#1e40af">PMD, ESLint, Apex</text>

  <line x1="280" y1="122" x2="305" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="305" y="95" width="120" height="55" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  </g>
  <text x="365" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">Apex tests</text>
  <text x="365" y="138" font-size="9" text-anchor="middle" fill="#166534">75%+ on changes</text>

  <line x1="425" y1="122" x2="450" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="450" y="95" width="120" height="55" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  </g>
  <text x="510" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#451a03">Validate deploy</text>
  <text x="510" y="138" font-size="9" text-anchor="middle" fill="#92400e">--check, scratch org</text>

  <line x1="570" y1="122" x2="595" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="595" y="95" width="120" height="55" rx="6" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  </g>
  <text x="655" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#3b0764">Static analysis</text>
  <text x="655" y="138" font-size="9" text-anchor="middle" fill="#5b21b6">Security, complexity</text>

  <line x1="715" y1="122" x2="740" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="740" y="95" width="120" height="55" rx="6" fill="#cffafe" stroke="#0e7490" stroke-width="2"/>
  </g>
  <text x="800" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#164e63">Optional: install</text>
  <text x="800" y="138" font-size="9" text-anchor="middle" fill="#155e75">to ephemeral org</text>

  <line x1="860" y1="122" x2="885" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="885" y="95" width="140" height="55" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="955" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Reviewer approval</text>
  <text x="955" y="138" font-size="9" text-anchor="middle" fill="#cbd5e1">+ branch protection</text>

  <!-- Merge row -->
  <g filter="url(#ds-cd)">
    <rect x="160" y="215" width="160" height="55" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="240" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">Build package version</text>
  <text x="240" y="258" font-size="9" text-anchor="middle" fill="#9a3412">2GP unlocked, beta</text>

  <line x1="320" y1="242" x2="345" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="345" y="215" width="160" height="55" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  </g>
  <text x="425" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#831843">Install to integration</text>
  <text x="425" y="258" font-size="9" text-anchor="middle" fill="#9d174d">Sandbox or scratch org</text>

  <line x1="505" y1="242" x2="530" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="530" y="215" width="160" height="55" rx="6" fill="#cffafe" stroke="#0e7490" stroke-width="2"/>
  </g>
  <text x="610" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#164e63">Smoke tests</text>
  <text x="610" y="258" font-size="9" text-anchor="middle" fill="#155e75">Apex, integration</text>

  <line x1="690" y1="242" x2="715" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="715" y="215" width="160" height="55" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  </g>
  <text x="795" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">Notify channel</text>
  <text x="795" y="258" font-size="9" text-anchor="middle" fill="#166534">Slack/Teams + status</text>

  <!-- Release row -->
  <g filter="url(#ds-cd)">
    <rect x="160" y="355" width="140" height="55" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  </g>
  <text x="230" y="380" font-size="11" font-weight="700" text-anchor="middle" fill="#451a03">Promote to released</text>
  <text x="230" y="398" font-size="9" text-anchor="middle" fill="#92400e">2GP, immutable</text>

  <line x1="300" y1="382" x2="325" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="325" y="355" width="140" height="55" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  </g>
  <text x="395" y="380" font-size="11" font-weight="700" text-anchor="middle" fill="#831843">Install to QA</text>
  <text x="395" y="398" font-size="9" text-anchor="middle" fill="#9d174d">Full sandbox</text>

  <line x1="465" y1="382" x2="490" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="490" y="355" width="140" height="55" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="560" y="378" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Approval gate</text>
  <text x="560" y="396" font-size="9" text-anchor="middle" fill="#cbd5e1">QA sign-off</text>

  <line x1="630" y1="382" x2="655" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="655" y="355" width="140" height="55" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="725" y="380" font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">Install to UAT</text>
  <text x="725" y="398" font-size="9" text-anchor="middle" fill="#9a3412">Stakeholder review</text>

  <line x1="795" y1="382" x2="820" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="820" y="355" width="140" height="55" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="890" y="378" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Approval gate</text>
  <text x="890" y="396" font-size="9" text-anchor="middle" fill="#cbd5e1">Final sign-off</text>

  <line x1="960" y1="382" x2="985" y2="382" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-cd)"/>

  <g filter="url(#ds-cd)">
    <rect x="985" y="355" width="180" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="1075" y="380" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">Install to production</text>
  <text x="1075" y="398" font-size="9" text-anchor="middle" fill="#991b1b">Quick deploy + smoke</text>

  <!-- Bottom rule -->
  <g filter="url(#ds-cd)">
    <rect x="40" y="460" width="1120" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="60" y="485" font-size="13" font-weight="700" fill="#0f172a">Why three rows, not one big pipeline</text>
  <text x="60" y="506" font-size="11" fill="#334155">Pull requests verify intent. Merge to main builds artifacts. Release tag promotes to production. Each gate is a place where a human can stop the train.</text>
  <text x="60" y="525" font-size="11" fill="#334155">A package version is built once, on merge. It is the same version that flows through QA, UAT, and production. No rebuilds at each stage.</text>
  <text x="60" y="544" font-size="11" fill="#334155">If your pipeline rebuilds for production, you are testing one artifact and shipping a different one. That is the most common cause of "worked in QA, broke in prod".</text>
</svg>
